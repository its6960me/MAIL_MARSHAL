<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mail Marshal</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#050a14;--card:#0d1626;--ink:#e6f4ff;--mute:#8aa3c2;--line:#1f3452;--acc:#46e0b8}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#edf5ff;--card:#fff;--ink:#12203d;--mute:#5b6d92;--line:#cfdcf5}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif}
.wrap{max-width:940px;margin:0 auto;padding:12px}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;color:#fff;font-weight:700;cursor:pointer;background:#2f4f7a}
canvas{width:100%;display:block;border-radius:20px;border:2px solid var(--line);touch-action:none;box-shadow:0 10px 50px #46e0b833}
.login{display:grid;place-items:center;min-height:90vh;text-align:center}
.login h1{font-size:2.8rem;margin:0;background:linear-gradient(90deg,#46e0b8,#4fc3ff,#ffc83d);-webkit-background-clip:text;background-clip:text;color:transparent}
.gbtn{background:#fff;color:#333;border:1px solid #ddd;margin-top:18px;padding:12px 20px}
.hint{color:var(--mute);font-size:.88rem}
.tabs{display:flex;gap:6px;margin:12px 0 8px;flex-wrap:wrap}.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line)}.tabs button.on{background:var(--acc);color:#04101f}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:80px}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}.row:last-child{border:0}
input{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:min(100%,320px)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:9}
.pg{width:min(100%,520px)}.menu{display:grid;gap:10px;margin-top:18px}.big{padding:14px;font-size:1.05rem}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}.acts.off button{opacity:.45}
.top{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:20}.mbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(92vw,380px)}.q{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
body{background:radial-gradient(circle at 50% 0,#12305a,var(--bg) 62%) fixed}.big{transition:.15s}.big:hover{filter:brightness(1.15);transform:translateY(-2px)}.login h1{filter:drop-shadow(0 0 18px #46e0b866)}

.splash{position:relative;min-height:92vh;display:grid;place-items:center;text-align:center;overflow:hidden;border-radius:24px}
.pl{position:absolute;font-style:normal;font-size:2rem;left:-10%;animation:fly 9s linear infinite;opacity:.8}.p1{top:14%}.p2{top:34%;animation-delay:-3s;animation-duration:12s;font-size:1.5rem}.p3{top:76%;animation-delay:-6s;animation-duration:15s}
@keyframes fly{to{left:110%}}@keyframes spin{to{transform:rotate(360deg)}}
.radar{position:absolute;width:560px;max-width:92vw;aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:conic-gradient(from 0deg,#46e0b855,#0000 28%),repeating-radial-gradient(circle,#0000 0 58px,var(--line) 59px 60px);animation:spin 5s linear infinite}
@media(prefers-reduced-motion:reduce){.pl,.radar{animation:none}}
.sbox{position:relative;z-index:1;max-width:520px;padding:20px}
.logo{font-size:clamp(2.6rem,9vw,4.4rem);margin:10px 0;background:linear-gradient(90deg,#46e0b8,#4fc3ff,#ffc83d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #46e0b866)}
.badge{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-size:.78rem;letter-spacing:.08em;color:var(--acc)}
.go{background:#46e0b8;color:#04101f;min-width:180px}
.lcard{display:grid;grid-template-columns:1fr 1fr;width:min(100%,820px);background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;text-align:left;box-shadow:0 10px 50px #46e0b822}
.lside{padding:28px;background:linear-gradient(160deg,#12305a,#0b1a2c);color:#e6f4ff}.lside h2{font-size:1.7rem;margin:14px 0}.lbrand{font-weight:800;letter-spacing:.04em;color:#46e0b8}
.feat{list-style:none;padding:0;margin:0;display:grid;gap:10px;color:#c9def5;font-size:.95rem}
.lmain{padding:28px}.lmain h2{margin:0 0 4px}.lmain input{width:100%}
.gg{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:14px 0}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:.8rem;margin:6px 0 10px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:#ff5a6e;font-size:.85rem;min-height:1.2em;margin-top:6px}.lnk{background:none;color:var(--mute);padding:6px 0;margin-top:6px}
@media(max-width:700px){.lcard{grid-template-columns:1fr}.lside{padding:20px}.feat{display:none}}
.step{color:var(--acc);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.idcard{display:flex;gap:14px;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px;margin:12px 0}
.av{font-size:2.2rem;width:64px;height:64px;display:grid;place-items:center;border-radius:50%;border:2px solid var(--acc);background:var(--card)}.idcard.sm .av{width:48px;height:48px;font-size:1.6rem}.cs{font-size:1.4rem;font-weight:800}
.avs{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}.avb{font-size:1.6rem;background:var(--bg);border:2px solid var(--line);padding:6px 12px}.avb.on{border-color:var(--acc);background:var(--card)}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--acc);width:24px}
.bi{font-size:3.4rem}.cd{font-size:2.4rem;font-weight:800;color:var(--acc);height:3rem;margin:12px 0}.ok{color:#46e0b8}
</style></head><body><div class="wrap" id="app"></div>
<script>
const $=s=>document.querySelector(s);
const POOL=[["Hana Tanaka","hana@studyhub.jp","Project review is due","Work"],["Kenji Sato","kenji@hackfest.dev","Hackathon schedule updated","Event"],["Mega Deals","offers@megadeals.biz","90% OFF flash sale!!!","Promo"],["Prof. Mori","mori@university.edu","Exam hall details","School"],["Yuki Ito","yuki@friends.mail","Dinner on Friday?","Friend"],["PromoBot","no-reply@promobot.io","You won a gift card","Promo"],["Rin Okada","rin@startup.co","Invoice #4821 due","Bill"],["Sora Kimura","sora@team.work","Standup notes","Work"],["Newsletter Weekly","news@weekly.digest","Top 10 stories","News"],["Aiko Mizuno","aiko@design.studio","Logo drafts ready","Work"],["Cheap Pills","spam@cheappills.xyz","Limited offer for you","Promo"],["Taro Yamada","taro@bank.example","Security alert: new sign-in","Alert"],["Electric Co","bills@power.example","Bill due Monday","Bill"]];
const BINS=[{k:"imp",n:"Land (Important)",c:"#ffc83d"},{k:"rem",n:"Hold (Remind)",c:"#a77bff"},{k:"trash",n:"Divert (Trash)",c:"#4fc3ff"},{k:"del",n:"Cancel (Delete)",c:"#ff5a6e"},{k:"blk",n:"No-fly (Block)",c:"#b4c0d4"}];
const TAGC={Work:"#ffc83d",School:"#ffc83d",Friend:"#ff8fc0",Alert:"#ff7a45",Bill:"#a77bff",Event:"#5ee0c0",News:"#4fc3ff",Promo:"#ff5a6e"};
const W=940,H=580,HUB={x:470,y:205},HOLDP={x:140,y:140},RX0=250,RX1=690;
let G={fuelM:1,spawnM:1,paused:false,dn:"Normal",charges:1,focusT:0,hi:0,user:null,state:"idle",pl:[],fx:[],rw:[{y:440,busy:null,closeT:0},{y:505,busy:null,closeT:0}],score:0,combo:0,best:0,safe:100,sorted:0,auto:0,t:0,spawnT:0,stormT:18,sel:null,mouse:{x:0,y:0},shake:0,uid:0,msg:"",msgT:0,flash:0};
let L={imp:[],rem:[],block:new Set(),tab:"imp"};
try{L.block=new Set(JSON.parse(localStorage.getItem("mr_block")||"[]"))}catch(e){}
L.hist=[];L.rm=[];L.tab="all";
try{L.hist=JSON.parse(localStorage.getItem("mr_hist")||"[]")}catch(e){}
try{L.rm=JSON.parse(localStorage.getItem("mr_rm")||"[]")}catch(e){}
const saveL=()=>{try{localStorage.setItem("mr_hist",JSON.stringify(L.hist.slice(0,80)));localStorage.setItem("mr_rm",JSON.stringify(L.rm))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const pad=n=>String(n).padStart(2,"0");
const fmt=t=>new Date(t).toLocaleString([],{dateStyle:"medium",timeStyle:"short"});
const localVal=t=>{const d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())};
const saveB=()=>{try{localStorage.setItem("mr_block",JSON.stringify([...L.block]))}catch(e){}};
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
function hash(s){let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h}
const SND={on:true};try{SND.on=localStorage.getItem("mr_snd")!=="0"}catch(e){}
let AC;function beep(f,d=.12,type="sine"){if(!SND.on)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const IMG={};
function face(seed){if(IMG[seed])return IMG[seed];const h=hash(seed),hair=`hsl(${h%360} 80% 58%)`,skin=["#ffe2cf","#f9d3b4","#fbe7d9"][h%3],eye=`hsl(${(h>>3)%360} 85% 48%)`;
const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"><path d="M10 34C8 12 24 4 32 4s24 8 22 30c-4-10-10-14-22-14S14 24 10 34z" fill="${hair}"/><ellipse cx="32" cy="36" rx="19" ry="21" fill="${skin}"/><path d="M13 32C20 28 26 22 30 14c4 8 12 14 21 18-2-12-9-20-19-20S14 20 13 32z" fill="${hair}"/><ellipse cx="24" cy="38" rx="5" ry="6.5" fill="#fff"/><ellipse cx="40" cy="38" rx="5" ry="6.5" fill="#fff"/><ellipse cx="24" cy="39" rx="3.6" ry="5" fill="${eye}"/><ellipse cx="40" cy="39" rx="3.6" ry="5" fill="${eye}"/><circle cx="25.5" cy="36.5" r="1.5" fill="#fff"/><circle cx="41.5" cy="36.5" r="1.5" fill="#fff"/><path d="M28 50q4 3 8 0" stroke="#c2566b" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>`;
const i=new Image();i.src="data:image/svg+xml;utf8,"+encodeURIComponent(svg);return IMG[seed]=i}
const level=()=>Math.floor(G.sorted/8);
const rank=()=>G.score>=900?"Tower Chief":G.score>=450?"Supervisor":G.score>=180?"Controller":"Trainee";
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* static airport background */
const PALS=[{n:"Midnight",a:"#07101f",b:"#0b1a2c",bld:"#0c2a22",rd:"#16314d",gl:"#3a2a7a99",mt:"#0a1730",ct:"#0d1f3a"},{n:"Sunset",a:"#2a1040",b:"#b4472f",bld:"#2a1a2a",rd:"#6a3040",gl:"#ff8a3d88",mt:"#3a1630",ct:"#2a1226"},{n:"Aurora",a:"#031a1f",b:"#0a4a3f",bld:"#06302a",rd:"#1a5a4a",gl:"#46e0b877",mt:"#04282a",ct:"#052a2e"},{n:"Neon City",a:"#12072e",b:"#3a0f5a",bld:"#2a0f3a",rd:"#5a2a8a",gl:"#ff4fd888",mt:"#2a0a46",ct:"#220a3a"}];
const BGS=PALS.map(pal=>{const BG=document.createElement("canvas");BG.width=W;BG.height=H;(function(){const c=BG.getContext("2d");let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,pal.a);g.addColorStop(1,pal.b);c.fillStyle=g;c.fillRect(0,0,W,H);
for(let i=0;i<260;i++){c.fillStyle=["#ffd98a55","#9ad8ff44","#ffffff33"][i%3];c.fillRect(hash(i*5)%W,hash(i*11)%380,2,2)}
c.fillStyle=pal.bld;for(let i=0;i<9;i++)c.fillRect(hash(i*17)%W,hash(i*7)%350,80+hash(i)%90,40+hash(i*3)%50);
c.strokeStyle=pal.rd;c.lineWidth=3;c.beginPath();c.moveTo(0,330);c.bezierCurveTo(300,300,600,380,W,320);c.stroke();
{let g2=c.createLinearGradient(0,260,0,430);g2.addColorStop(0,"#0000");g2.addColorStop(1,pal.gl);c.fillStyle=g2;c.fillRect(0,260,W,170);
c.fillStyle=pal.mt;c.beginPath();c.moveTo(0,400);for(let x=0;x<=W;x+=40)c.lineTo(x,330-hash(x*3)%70);c.lineTo(W,400);c.fill();
for(let i=0;i<46;i++){const x=hash(i*13)%W,h=30+hash(i*5)%60;c.fillStyle=pal.ct;c.fillRect(x,400-h,16,h);for(let k=0;k<h;k+=8)if(hash(i*k+1)%3){c.fillStyle="#ffd98a99";c.fillRect(x+3,400-h+k+2,3,3);c.fillRect(x+9,400-h+k+2,3,3)}}}
[440,505].forEach((y,i)=>{c.fillStyle="#161e2c";c.fillRect(RX0-40,y-20,RX1-RX0+80,40);c.strokeStyle="#2b3a52";c.lineWidth=2;c.strokeRect(RX0-40,y-20,RX1-RX0+80,40);
c.fillStyle="#cfd8ea99";for(let x=RX0+20;x<RX1-20;x+=34)c.fillRect(x,y-1.5,18,3);for(let k=-14;k<=14;k+=4)c.fillRect(RX0-34,y+k,18,2);c.font="bold 13px Trebuchet MS";c.fillText(i?"27R":"27L",RX0+30,y+5)});
c.fillStyle="#0f1b2d";c.fillRect(RX0,538,440,42);for(let i=0;i<30;i++){c.fillStyle=i%3?"#ffd36acc":"#6af0ffaa";c.fillRect(RX0+8+i*14,548+(i%2)*10,6,5)}
c.fillStyle="#1a2b45";c.fillRect(710,520,26,60);c.fillStyle="#ffd36a";c.fillRect(712,516,22,8)})();return BG});let bgI=0,bgT=0,bgPrev=null;
const CL=Array.from({length:7},(_,i)=>({x:Math.random()*W,y:40+Math.random()*420,r:90+Math.random()*100,s:6+Math.random()*10}));

const GSVG='<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.9 2.3-8.5 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>';
const AVA=["✈️","🚁","🚀","🛸","🎈","🛩️"];
const cs=()=>G.callsign||G.user.split("@")[0].slice(0,12);
function loadProf(){G.ava="✈️";G.callsign=null;try{const p=JSON.parse(localStorage.getItem("mr_prof_"+G.user)||"null");if(p){G.callsign=p.c;G.ava=p.a;return true}}catch(e){}return false}
function seenBrief(){try{return localStorage.getItem("mr_seen_"+G.user)==="1"}catch(e){return false}}
function splashView(){$("#app").innerHTML=`<div class="splash"><div><i class="pl p1">✈️</i><i class="pl p2">🛩️</i><i class="pl p3">🚁</i></div><div class="radar"></div><div class="sbox"><span class="badge">🛬 AIR TRAFFIC CONTROL FOR YOUR INBOX</span><h1 class="logo">Mail Marshal</h1><p>Every email is an aircraft low on fuel. Guide each one to safety, or send it away.</p><button class="big go" id="sgo">▶ Start</button></div></div>`;$("#sgo").onclick=()=>{beep(520,.15);loginView()}}
function loginView(){$("#app").innerHTML=`<div class="login"><div class="lcard"><div class="lside"><div class="lbrand">🛬 MAIL MARSHAL</div><h2>Clear the skies.<br>Clear your inbox.</h2><ul class="feat"><li>✈️ Emails arrive as aircraft</li><li>🎯 Land, hold, divert, cancel or block</li><li>⏰ Reminders ring at the time you pick</li><li>🏆 Combos, badges and ranks</li></ul></div><div class="lmain"><h2>Sign in</h2><p class="hint">Use your Gmail address to take the tower.</p><button class="gbtn gg" id="g">${GSVG}Continue with Google</button><div class="or"><span>or enter your Gmail</span></div><input id="em" type="email" placeholder="you@gmail.com" autocomplete="email"><div class="err" id="er"></div><button class="big" id="go" style="background:#46e0b8;color:#04101f;width:100%;margin-top:8px">Enter the tower →</button><p class="hint">Demo mode uses a sample inbox until your Google client ID is connected.</p><button class="lnk" id="bk">← Back</button></div></div></div>`;
const sub=()=>{const n=$("#em").value.trim();if(/^[^@\s]+@gmail\.com$/i.test(n)){G.user=n;beep(660,.15);loadProf()?(seenBrief()?homeView():briefView(0)):profileView(true)}else $("#er").textContent="Please use a valid @gmail.com address"};
/* PRODUCTION: Google Identity Services token client, scope gmail.modify, then feed real messages into spawn() */
$("#g").onclick=()=>{if(!$("#em").value.trim())$("#em").value="player@gmail.com";sub()};$("#go").onclick=sub;$("#bk").onclick=splashView;$("#em").onkeydown=e=>{if(e.key==="Enter")sub()}}
function profileView(first){let a=G.ava||"✈️";
page(`<div class="step">${first?"Step 1 · ":""}Pilot ID</div><h2>Choose your call sign</h2><p class="hint">It appears on the tower hub and in the game.</p><div class="idcard"><div class="av" id="pav"></div><div><div class="hint">CALL SIGN</div><div class="cs" id="pcs"></div></div></div><input id="pcsi" maxlength="12" placeholder="e.g. Maverick"><div class="avs">${AVA.map(x=>`<button class="avb" data-a="${x}">${x}</button>`).join("")}</div><div class="menu"><button class="big" id="psv" style="background:#46e0b8;color:#04101f">Confirm →</button>${first?"":`<button class="big" onclick="homeView()">← Back</button>`}</div>`);
const inp=$("#pcsi");inp.value=cs();const up=()=>{$("#pcs").textContent=inp.value.trim()||"…";$("#pav").textContent=a;document.querySelectorAll(".avb").forEach(b=>b.classList.toggle("on",b.dataset.a===a))};up();inp.oninput=up;
document.querySelectorAll(".avb").forEach(b=>b.onclick=()=>{a=b.dataset.a;up();beep(500,.06)});
$("#psv").onclick=()=>{const v=inp.value.trim();if(!/^[\w \-]{3,12}$/.test(v)){toast("Call sign: 3 to 12 letters, numbers or spaces");return}G.callsign=v;G.ava=a;try{localStorage.setItem("mr_prof_"+G.user,JSON.stringify({c:v,a}))}catch(e){}beep(660,.15);first&&!seenBrief()?briefView(0):homeView()}}
const BRIEF=[{t:"Welcome to the tower",i:"🛬",b:"Your inbox has become a busy airport. Every email is an aircraft running low on fuel, and you are the Mail Marshal in charge."},{t:"Your five calls",i:"🎯",list:1},{t:"Read the sky",i:"👀",b:"Gold ★ VIP flights pay triple. Alerts from odd sender addresses may be phishing, so block or delete them. Watch the fuel bar, runway traffic and storms."},{t:"Build your combo",i:"⚡",b:"Fast, correct calls build a combo. Every 5 combo earns a Radar Ping: press SPACE to slow time for 4 seconds. Wrong calls cost points, safety and your combo."}];
function finishBrief(){try{localStorage.setItem("mr_seen_"+G.user,"1")}catch(e){}homeView()}
function briefView(n){const s=BRIEF[n],last=n===BRIEF.length-1;

const TB={all:"All activity",imp:"★ Landed",rem:"⏰ Reminders",trash:"Diverted",del:"Cancelled",blk:"No-fly"};
const KN={imp:"Landed (Important)",rem:"Held (Remind)",trash:"Diverted (Trash)",del:"Cancelled (Delete)",blk:"No-fly (Block)"};
const cnt=k=>k==="rem"?L.rm.length:k==="blk"?L.block.size:L.hist.filter(h=>h.k===k).length;
function hrow(h){const c=BINS.find(b=>b.k===h.k).c;return `<div class="row"><span>${esc(h.p[0])}<br><small class="hint">${esc(topic(h.p[2]))} · ${esc(h.p[1])}</small></span><span style="text-align:right;color:${c}">${KN[h.k]}<br><small class="hint">${fmt(h.at)}</small></span></div>`}
function renderTabs(){if(!$("#tabs"))return;
$("#tabs").innerHTML=Object.keys(TB).map(k=>`<button class="${L.tab===k?"on":""}" onclick="L.tab='${k}';renderTabs()">${TB[k]}${k==="all"?" ("+L.hist.length+")":" ("+cnt(k)+")"}</button>`).join("");
let h="";const none=`<span class="hint">Nothing here yet. Sorted emails appear here so you can re-check them.</span>`;
if(L.tab==="all")h=L.hist.slice(0,30).map(hrow).join("")||none;
else if(["imp","trash","del"].includes(L.tab))h=L.hist.filter(x=>x.k===L.tab).slice(0,30).map(hrow).join("")||none;
else if(L.tab==="rem")h=L.rm.map((r,i)=>`<div class="row"><span>${esc(r.p[0])}<br><small class="hint">${esc(topic(r.p[2]))}</small></span><span style="text-align:right">${r.done?"✓ Sent":"⏳ Due"} ${fmt(r.at)}<br><button style="padding:3px 9px;background:#ff5a6e" onclick="delRm(${i})">Remove</button></span></div>`).join("")||none;
else h=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><input id="bi" placeholder="sender@example.com"><button onclick="addB()">Add to no-fly list</button></div>`+([...L.block].map(a=>`<div class="row"><span>${esc(a)}</span><button style="padding:4px 10px;background:#ff5a6e" onclick="L.block.delete('${esc(a)}');saveB();renderTabs()">Remove</button></div>`).join("")||`<span class="hint">Flights from these senders are rejected at the border for bonus points.</span>`);
